<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotifyDJ</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
  :root {
    --bg:      #0a0a0c;
    --surface: #111115;
    --border:  #1e1e26;
    --accent:  #1db954;
    --accent2: #ff4d4d;
    --accent3: #a78bfa;
    --text:    #e8e8f0;
    --muted:   #555566;
    --warn:    #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    height: 100vh;
    display: grid;
    grid-template-rows: 72px 1fr 64px;
    overflow: hidden;
  }

  /* TOP BAR */
  header {
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: -0.5px;
    color: var(--accent);
    white-space: nowrap;
  }
  .logo span { color: var(--text); }
  .now-playing {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
    padding-left: 20px;
    border-left: 1px solid var(--border);
    overflow: hidden;
  }
  .np-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .np-artist {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 15px;
    white-space: nowrap;
    min-width: 0;
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .np-sep { color: var(--muted); flex-shrink: 0; }
  .np-track {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .playback-progress {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 0 1 320px;
    min-width: 160px;
    color: #a0a0b5;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .progress-time { min-width: 4ch; text-align: center; }
  .progress-rail {
    flex: 1;
    height: 4px;
    overflow: hidden;
    border-radius: 4px;
    background: #2a2a35;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: inherit;
    transform: scaleX(0);
    transform-origin: left;
  }
  .playback-progress.is-stale .progress-fill { background: #77778b; }
  @media (max-width: 900px) {
    header { gap: 12px; padding: 0 16px; }
    .playback-progress { flex-basis: 200px; min-width: 130px; gap: 6px; }
  }
  .rec-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--accent2);
    opacity: 0;
    transition: opacity 0.2s;
    flex-shrink: 0;
  }
  .rec-indicator.active { opacity: 1; }
  .rec-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent2);
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .mode-badge {
    margin-left: auto;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    white-space: nowrap;
    border: 1px solid var(--accent);
    color: var(--accent);
    transition: all 0.3s;
    flex-shrink: 0;
  }
  .mode-badge.ai { border-color: var(--accent3); color: var(--accent3); }

  /* PANELS */
  main {
    display: grid;
    grid-template-columns: 1fr 340px;
    overflow: hidden;
  }
  .panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid var(--border);
  }
  .panel:last-child { border-right: none; }
  .panel-header {
    padding: 10px 16px;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-header .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }
  .log {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    line-height: 1.6;
  }
  .log::-webkit-scrollbar { width: 4px; }
  .log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .log-line {
    padding: 1px 0;
    opacity: 0;
    animation: fadein 0.15s forwards;
    word-break: break-word;
  }
  @keyframes fadein { from{opacity:0;transform:translateY(2px)} to{opacity:1;transform:translateY(0)} }
  .log-line.dj-pick   { color: var(--accent); font-weight: 500; }
  .log-line.weight    { color: var(--muted); font-size: 12px; }
  .log-line.ai-line   { color: var(--accent3); }
  .log-line.error     { color: var(--accent2); }
  .log-line.discovery { color: var(--warn); }
  .log-line.track-end { color: var(--muted); font-style: italic; }
  .log-line.filter    { color: #7777aa; font-size: 11px; }
  .log-line.section {
    margin: 16px 0 8px;
    padding-top: 10px;
    border-top: 1px solid #30303d;
    color: #a0a0b5;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .log-line.section:first-child { margin-top: 0; }
  .log-line.dj-pick { color: #65df92; padding: 9px 12px; margin: 8px 0; border-left: 3px solid #65df92; background: #122219; border-radius: 4px; }
  .log-line.block { color: #c4b5fd; }
  .log-line.ready { color: #7dd3fc; padding: 5px 0; }
  .log-line.warning { color: #fcd34d; border-left: 3px solid #f59e0b; padding: 8px 12px; margin: 6px 0; background: #292113; }
  .log-line.error { color: #fda4af; border-left: 3px solid #fb7185; padding: 8px 12px; margin: 6px 0; background: #2a171d; }
  .log-line.state { color: #a5d8ff; padding: 6px 0; }
  .log-line.detail { color: #9b9bb3; font-size: 11px; }
  #dj-log:not(.show-details) .detail { display: none; }
  .log-tools { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 11px; color: #b7b7ca; }
  .log-tools .details-toggle {
    position: relative; margin-left: auto; display: inline-flex; align-items: center;
    gap: 10px; padding: 7px 10px; border: 1px solid #353542; border-radius: 8px;
    background: #19191f; color: #b7b7ca; cursor: pointer; user-select: none;
    transition: background .15s, border-color .15s, color .15s;
  }
  .details-toggle:hover { background: #22212b; border-color: #696079; color: #e8e8f0; }
  .details-toggle input {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: 0;
    opacity: 0; overflow: hidden;
  }
  .details-toggle:focus-within { outline: 2px solid #c4b5fd; outline-offset: 3px; }
  .details-toggle .toggle-track {
    position: relative; flex-shrink: 0; width: 30px; height: 18px;
    border: 1px solid #5b5b6d; border-radius: 20px; background: #30303c;
    transition: background .15s, border-color .15s;
  }
  .details-toggle .toggle-track::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 10px; height: 10px;
    border-radius: 50%; background: #b7b7ca; transition: transform .15s, background .15s;
  }
  .details-toggle input:checked ~ .toggle-track { background: #8b5cf6; border-color: #a78bfa; }
  .details-toggle input:checked ~ .toggle-track::after { transform: translateX(12px); background: #fff; }
  .details-toggle input:checked ~ .toggle-label { color: #ddd6fe; }
  @media (prefers-reduced-motion: reduce) {
    .details-toggle, .details-toggle .toggle-track, .details-toggle .toggle-track::after { transition: none; }
  }
  .log-key-song { color: #65df92; }
  .log-key-block { color: #c4b5fd; }
  .log-key-warning { color: #fcd34d; }

  .hotkey-help {
    flex-shrink: 0;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    font-size: 11px;
    line-height: 1.6;
    max-height: 35vh;
    overflow: auto;
  }
  .hotkey-title { color: #a0a0b5; margin-bottom: 10px; }
  .hotkey-list {
    display: grid;
    grid-template-columns: repeat(3, minmax(max-content, 1fr));
    gap: 8px 24px;
    list-style: none;
  }
  .hotkey-list li { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .hotkey-list kbd {
    flex-shrink: 0;
    padding: 2px 7px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    font: inherit;
    color: var(--accent);
  }
  @media (max-width: 1300px) {
    .hotkey-list { grid-template-columns: repeat(2, minmax(max-content, 1fr)); }
  }
  @media (max-width: 1000px) {
    .hotkey-list { grid-template-columns: minmax(max-content, 1fr); }
  }

  /* AI INPUT */
  .ai-input-area {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .ai-input-row { display: flex; gap: 8px; }
  .ai-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    outline: none;
    transition: border-color 0.2s;
  }
  .ai-input:focus { border-color: var(--accent3); }
  .ai-input::placeholder { color: var(--muted); }
  .send-btn {
    padding: 8px 14px;
    background: var(--accent3);
    border: none;
    border-radius: 6px;
    color: #fff;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .send-btn:hover { opacity: 0.85; }

  /* FOOTER */
  footer {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    overflow-x: auto;
  }
  footer::-webkit-scrollbar { display: none; }
  .btn {
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .btn:hover               { border-color: var(--accent); color: var(--accent); }
  .btn.mode:hover          { border-color: var(--accent); color: var(--accent); }
  .btn.active-mode         { border-color: var(--accent); color: var(--accent); background: rgba(29,185,84,0.08); }
  .btn.skip                { border-color: var(--warn); color: var(--warn); }
  .btn.skip:hover          { background: rgba(245,158,11,0.1); }
  .btn.ban                 { border-color: var(--accent2); color: var(--accent2); }
  .btn.ban:hover           { background: rgba(255,77,77,0.1); }
  .btn.quit                { border-color: #444; color: var(--muted); }
  .btn.quit:hover          { border-color: var(--accent2); color: var(--accent2); }
  .btn.playback            { cursor: default; }
  .divider { width:1px; height:24px; background:var(--border); flex-shrink:0; }
  .mode-group { display:flex; gap:4px; flex-shrink:0; }
</style>
</head>
<body>

<header>
  <div class="logo">DJ<span>ctrl</span></div>
  <div class="now-playing">
    <span class="np-label">Now</span>
    <span class="np-artist" id="now-artist">—</span>
    <span class="np-sep" id="now-sep" style="display:none">—</span>
    <span class="np-track" id="now-track"></span>
  </div>
  <div class="playback-progress is-stale" id="playback-progress" title="Keine Playback-Daten">
    <span class="progress-time" id="progress-elapsed">--:--</span>
    <div class="progress-rail" id="progress-rail" role="progressbar"
         aria-label="Songfortschritt" aria-valuemin="0" aria-valuemax="100" aria-valuetext="Keine Playback-Daten">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <span class="progress-time" id="progress-duration">--:--</span>
  </div>
  <div class="rec-indicator" id="rec-indicator">
    <div class="rec-dot"></div>REC
  </div>
  <div class="mode-badge" id="mode-badge">—</div>
</header>

<main>
  <div class="panel">
    <div class="panel-header"><div class="dot"></div><span id="dj-status">Warte auf DJ</span></div>
    <div class="log-tools" aria-label="Log-Anzeige">
      <span class="log-key-song">♫ Song</span>
      <span class="log-key-block">Abschnitt</span>
      <span class="log-key-warning">⚠ Hinweis</span>
      <label class="details-toggle">
        <input type="checkbox" role="switch" id="log-details" onchange="toggleLogDetails(this.checked)">
        <span class="toggle-track" aria-hidden="true"></span>
        <span class="toggle-label">Details anzeigen</span>
      </label>
    </div>
    <div class="log" id="dj-log"></div>
    <aside class="hotkey-help" aria-label="Hotkeys">
      <div class="hotkey-title">Hotkeys · F13 = rechte Strg</div>
      <ul class="hotkey-list">
        <li><kbd>F13 + 1</kbd> = Standard</li>
        <li><kbd>F13 + 2</kbd> = Skip</li>
        <li><kbd>F13 + 3</kbd> = Künstler sperren</li>
        <li><kbd>F13 + 4</kbd> = Song sperren</li>
        <li><kbd>F13 + 5</kbd> = DJ beenden</li>
        <li><kbd>F13 + V</kbd> = Sprachaufnahme starten/stoppen</li>
      </ul>
    </aside>
  </div>
  <div class="panel" style="flex-direction:column;display:flex;overflow:hidden;">
    <div class="panel-header"><div class="dot" style="background:var(--accent3)"></div>Voice / Chat</div>
    <div class="log" id="voice-log"></div>
    <div class="ai-input-area">
      <div class="ai-input-row">
        <input class="ai-input" id="ai-input" placeholder="Ask the DJ anything..." autocomplete="off"/>
        <button class="send-btn" onclick="sendAI()">Send</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="mode-group">
    <button class="btn mode" id="btn-5"  onclick="sendCmd('5')">Standard</button>
  </div>
  <div class="divider"></div>
  <button class="btn skip" onclick="sendCmd('skip')">⏭ Skip</button>
  <button class="btn ban"  onclick="sendCmd('ban-artist')">✕ Ban Artist</button>
  <button class="btn ban"  onclick="sendCmd('ban')">✕ Ban Track</button>
  <button class="btn quit" onclick="sendCmd('quit')">Quit DJ</button>
  <div class="divider"></div>
  <button class="btn playback" id="btn-playback">⏸ Paused</button>
</footer>

<script>
  const socket = io();
  const MAX_LINES = 300;
  const modeMap = {"Standard":"btn-5"};

  // Progress model: repeated websocket broadcasts are not new Spotify samples.
  function progressSampleFromState(data, previous, now) {
    const sample = data.playback_progress;
    if (!sample) return null;
    if (previous && previous.id === sample.sample_id) return previous;
    return {
      id: sample.sample_id, position: sample.progress_ms, duration: sample.duration_ms,
      playing: sample.is_playing, age: Math.max(0, sample.age_ms || 0), receivedAt: now,
    };
  }

  function progressAt(sample, now) {
    if (!sample) return null;
    const age = sample.age + Math.max(0, now - sample.receivedAt);
    // External playback is polled every 15s. Stop estimating after a missed
    // sample instead of animating indefinitely through an outage.
    const position = sample.position + (sample.playing ? Math.min(age, 18000) : 0);
    return { position: Math.max(0, Math.min(sample.duration, position)),
             duration: sample.duration, stale: sample.playing && age > 18000,
             playing: sample.playing };
  }

  function formatProgressTime(ms) {
    const seconds = Math.floor(Math.max(0, ms) / 1000);
    return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
  }
  // End progress model.

  let progressSample = null;
  let shuttingDown = false;
  function renderProgress() {
    const value = progressAt(progressSample, performance.now());
    const rail = document.getElementById("progress-rail");
    const elapsed = value ? formatProgressTime(value.position) : "--:--";
    const duration = value ? formatProgressTime(value.duration) : "--:--";
    const description = !value ? "Keine Playback-Daten"
      : value.stale ? "Warte auf neue Playback-Daten"
      : `${elapsed} / ${duration}${value.playing ? "" : " · Pausiert"}`;
    document.getElementById("progress-elapsed").textContent = elapsed;
    document.getElementById("progress-duration").textContent = duration;
    document.getElementById("playback-progress").classList.toggle("is-stale", !value || value.stale);
    document.getElementById("playback-progress").title = description;
    const fraction = value ? value.position / value.duration : 0;
    document.getElementById("progress-fill").style.transform = `scaleX(${fraction})`;
    rail.setAttribute("aria-valuetext", description);
    if (value) rail.setAttribute("aria-valuenow", String(Math.round(fraction * 100)));
    else rail.removeAttribute("aria-valuenow");
  }
  setInterval(renderProgress, 100);
  socket.on("disconnect", () => {
    progressSample = null; renderProgress();
    document.getElementById("dj-status").textContent = shuttingDown
      ? "DJ und Dashboard beendet. Für den Neustart start_dj_hidden.vbs ausführen."
      : "Verbindung zum DJ unterbrochen";
  });

  socket.on("state", (s) => {
    shuttingDown = Boolean(s.shutting_down);
    progressSample = progressSampleFromState(s, progressSample, performance.now());
    renderProgress();
    document.getElementById("dj-status").textContent = s.status || "Warte auf DJ";
    // Artist
    document.getElementById("now-artist").textContent = s.current_artist || "—";

    // Track name
    const track = s.current_track;
    const sep   = document.getElementById("now-sep");
    const tEl   = document.getElementById("now-track");
    if (track && track !== "—") {
      sep.style.display = "";
      tEl.textContent   = track;
    } else {
      sep.style.display = "none";
      tEl.textContent   = "";
    }

    // Mode badge
    const badge = document.getElementById("mode-badge");
    badge.textContent = s.mode === "AI" ? "" : (s.mode || "—");
    badge.hidden = s.mode === "AI";
    badge.className   = "mode-badge" + (s.mode === "AI" ? " ai" : "");

    // Mode buttons
    document.querySelectorAll(".btn.mode").forEach(b => b.classList.remove("active-mode"));
    if (modeMap[s.mode]) document.getElementById(modeMap[s.mode])?.classList.add("active-mode");

    // Rec indicator
    document.getElementById("rec-indicator").classList.toggle("active", !!s.recording);

    // Playback
    const pb = document.getElementById("btn-playback");
    if (s.is_playing) {
      pb.textContent         = "▶ Playing";
      pb.style.borderColor   = "var(--accent)";
      pb.style.color         = "var(--accent)";
    } else {
      pb.textContent         = "⏸ Nicht bestätigt / pausiert";
      pb.style.borderColor   = "#555566";
      pb.style.color         = "#555566";
    }
  });

  socket.on("dj_log",    d => appendLines("dj-log",    d.lines, classifyDJ));
  socket.on("voice_log", d => appendLines("voice-log", d.lines, classifyVoice));

  function appendLines(id, lines, classifier) {
    const el       = document.getElementById(id);
    const atBottom = el.scrollHeight - el.clientHeight <= el.scrollTop + 40;
    lines.forEach(line => {
      if (!line.trim()) return;
      const div = document.createElement("div");
      const category = classifier(line);
      div.className   = "log-line " + category;
      div.textContent = /^--- .+ ---$/.test(line) ? line.slice(4, -4) : line;
      el.appendChild(div);
    });
    while (el.children.length > MAX_LINES) el.removeChild(el.firstChild);
    if (atBottom) el.scrollTop = el.scrollHeight;
  }

  function classifyDJ(line) {
    const l = line.trim().toLowerCase();
    // Keep raw SDK noise and per-candidate searches available without repeating them in the overview.
    if (/^ai artist|^your application has reached a rate\/request limit|^max retries reached/.test(l)) return "detail";
    if (/startdiagnose|nicht bestätigt|fehlgeschlagen|fehler|timeouterror|zeitüberschreitung|traceback|exception|\berror\b|\bfailed\b/.test(l)) return "error";
    if (/rate.limit|http 429|blockplanung|keine passenden|kein passender|keine ungesperrten|automatische planung beendet|übersprungen|ausgelassen|playback-daten|freigegeben|neuer dj-befehl erforderlich|braucht spotify-leserechte/.test(l)) return "warning";
    if (/^--- neuer song ---$|^(?:standard dj|global dj|dj) ->|^track finished|^track near end|^skip hotkey/.test(l)) return "detail";
    if (/^--- standard:/.test(l)) return "section block";
    if (/^--- .+ ---$/.test(l)) return "section";
    if (/^standard: nächster abschnitt vorbereitet/.test(l)) return "ready";
    if (/pausiert|fortsetzen|gerätewechsel|wiedergabe.*freigegeben/.test(l)) return "state";
    if (/^standard: ki plant|netzwerk-zeitlimit|^ai suggested|^ai session|^ai year evidence|spotify-katalogfassung|fetched[=:]|after filter:|after recent filter:|after ban filter:|device:/.test(l)) return "detail";
    if (/^ai request|^ai interpretation|^ai wartet/.test(l)) return "ai-line";
    if (/^standard:|^wir hören|^aus deinem|^aus deinen|^zum entdecken|^weiter mit/.test(l)) return "block";
    if (line.includes(' — ')) return "dj-pick";
    return "";
  }

  function toggleLogDetails(show) {
    document.getElementById('dj-log').classList.toggle('show-details', show);
  }

  function classifyVoice(line) {
    if (line.startsWith("→") || line.startsWith("->")) return "ai-line";
    if (/you said/i.test(line))                        return "dj-pick";
    if (/error|failed/.test(line.toLowerCase()))       return "error";
    return "";
  }

  function sendCmd(cmd) { socket.emit("command", { cmd }); }

  function sendAI() {
    const input = document.getElementById("ai-input");
    const val   = input.value.trim();
    if (!val) return;
    socket.emit("command", { cmd: val });
    input.value = "";
  }

  document.getElementById("ai-input").addEventListener("keydown", e => {
    if (e.key === "Enter") sendAI();
  });
</script>
</body>
</html>
